<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="OpenStore — search public GitHub repos and get an AI-written, plain-language pitch instead of a technical README." />

    <!-- Aplica el tema guardado ANTES del primer paint, para que no haya un
         parpadeo oscuro/claro al cargar (el className de <body> de abajo es
         solo el valor por defecto para cuando no hay preferencia guardada). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("appstore-theme");
          if (t === "light" || t === "dark") {
            document.documentElement.setAttribute("data-theme", t);
          }
          document.documentElement.style.background = t === "light" ? "#f4f5f7" : "#121218";
        } catch (e) {}
      })();
    </script>

    <!-- Open Graph / redes sociales -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OpenStore" />
    <meta property="og:title" content="OpenStore — GitHub AI Explorer" />
    <meta property="og:description" content="Search public GitHub repos and get an AI-written, plain-language pitch instead of a technical README. Install with one click." />
    <meta property="og:image" content="https://app-repositorio-github-one.vercel.app/og-image.png" />
    <meta property="og:url" content="https://app-repositorio-github-one.vercel.app" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OpenStore — GitHub AI Explorer" />
    <meta name="twitter:description" content="Search public GitHub repos and get an AI-written, plain-language pitch instead of a technical README." />
    <meta name="twitter:image" content="https://app-repositorio-github-one.vercel.app/og-image.png" />

    <title>OpenStore</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
